<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#000000;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    background:white;
    width:100%;
    max-width:400px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0.5rem 1rem rgba(0,0,0,0.3);
}

.header{
    background:#808080;
    padding:20px;
}

.header h1{
    color:white;
    text-align:center;
    font-size:28px;
}

.form-area{
    padding:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#333;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:6px;
    font-size:14px;
    transition:0.3s;
}

input:focus{
    outline:none;
    border-color:#7e7883;
    box-shadow:0 0 0 0.2rem rgba(126,120,131,0.25);
}

.button-group{
    display:flex;
    gap:10px;
    margin-top:30px;
}

button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.btn-cadastro{
    background:linear-gradient(135deg,#0a0d1d 0%,#7e7883 100%);
    color:white;
}

.btn-cadastro:hover{
    background:linear-gradient(135deg,#0f0c13 0%,#181a25 100%);
}

.btn-limpar{
    background:#dcdcdc;
    color:#333;
}

.btn-limpar:hover{
    background:#c9c9c9;
}

.error{
    color:#e74c3c;
    font-size:12px;
    margin-top:5px;
    display:none;
}

#mensagem{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.login-text{
    text-align:center;
    margin-top:20px;
    color:#555;
}

.login-text a{
    color:#7e7883;
    text-decoration:none;
    font-weight:bold;
}

.login-text a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Cadastro</h1>
    </div>

    <div class="form-area">

        <form id="cadastroForm">

            <div class="form-group">
                <label>Nome Completo</label>

                <input type="text" id="nome" required>

                <span class="error" id="erroNome"></span>
            </div>

            <div class="form-group">
                <label>Email</label>

                <input type="email" id="email" required>

                <span class="error" id="erroEmail"></span>
            </div>

            <div class="form-group">
                <label>Usuário</label>

                <input type="text" id="usuario" required>

                <span class="error" id="erroUsuario"></span>
            </div>

            <div class="form-group">
                <label>Senha</label>

                <input type="password" id="senha" required>

                <span class="error" id="erroSenha"></span>
            </div>

            <div class="form-group">
                <label>Confirmar Senha</label>

                <input type="password" id="confirmaSenha" required>

                <span class="error" id="erroConfirmaSenha"></span>
            </div>

            <div class="button-group">

                <button type="submit" class="btn-cadastro">
                    Cadastrar
                </button>

                <button type="reset" class="btn-limpar">
                    Limpar
                </button>

            </div>

        </form>

        <div id="mensagem"></div>

        <p class="login-text">
            Já tem uma conta?
            <a href="login.html">
                Faça login
            </a>
        </p>

    </div>

</div>


<script type="module">

// IMPORT FIREBASE
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// CONFIG FIREBASE
const firebaseConfig = {

    apiKey: "AIzaSyB8Vtm3yMziXsbVWmPrbQtiG6x2QESiDd8",

    authDomain: "new-project-7ad9e.firebaseapp.com",

    projectId: "new-project-7ad9e",

    storageBucket: "new-project-7ad9e.firebasestorage.app",

    messagingSenderId: "713177573867",

    appId: "1:713177573867:web:9788adaa105382e0ba11ae"

};


// INICIAR FIREBASE
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


// FORM
const form = document.getElementById("cadastroForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const nome = document.getElementById("nome").value.trim();

    const email = document.getElementById("email").value.trim();

    const usuario = document.getElementById("usuario").value.trim();

    const senha = document.getElementById("senha").value;

    const confirmaSenha =
    document.getElementById("confirmaSenha").value;

    const mensagem =
    document.getElementById("mensagem");

    let valido = true;


    // LIMPAR ERROS
    document.querySelectorAll(".error").forEach((erro)=>{
        erro.style.display = "none";
    });


    // VALIDAR NOME
    if(nome.length < 3){

        document.getElementById("erroNome").textContent =
        "Nome deve ter no mínimo 3 caracteres";

        document.getElementById("erroNome").style.display =
        "block";

        valido = false;
    }


    // VALIDAR USUARIO
    if(usuario.length < 3){

        document.getElementById("erroUsuario").textContent =
        "Usuário deve ter no mínimo 3 caracteres";

        document.getElementById("erroUsuario").style.display =
        "block";

        valido = false;
    }


    // VALIDAR SENHA
    if(senha.length < 6){

        document.getElementById("erroSenha").textContent =
        "Senha deve ter no mínimo 6 caracteres";

        document.getElementById("erroSenha").style.display =
        "block";

        valido = false;
    }


    // CONFIRMAR SENHA
    if(senha !== confirmaSenha){

        document.getElementById("erroConfirmaSenha").textContent =
        "As senhas não correspondem";

        document.getElementById("erroConfirmaSenha").style.display =
        "block";

        valido = false;
    }


    // CADASTRO
    if(valido){

        try{

            const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                senha
            );


            // SALVAR NOME
            await updateProfile(userCredential.user, {

                displayName: nome

            });


            mensagem.style.color = "green";

            mensagem.innerHTML =
            "Cadastro realizado com sucesso!";


            console.log(userCredential.user);


            form.reset();


            // REDIRECIONAR
            // window.location.href = "login.html";


        }catch(error){

            mensagem.style.color = "red";

            if(error.code === "auth/email-already-in-use"){

                mensagem.innerHTML =
                "Esse email já está cadastrado";

            }else if(error.code === "auth/invalid-email"){

                mensagem.innerHTML =
                "Email inválido";

            }else if(error.code === "auth/weak-password"){

                mensagem.innerHTML =
                "Senha muito fraca";

            }else{

                mensagem.innerHTML =
                "Erro ao cadastrar";

            }

            console.log(error);

        }

    }

});

</script>

</body>
</html>
