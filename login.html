<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #000000; 
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 15px;
        }
        .login-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .login-card .card-header {
            background: #808080;
            border: none;
            border-radius: 10px 10px 0 0;
        }
        .login-card .card-header h3 {
            color: white;
            margin: 0;
            text-align: center;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #0a0d1d 0%, #7e7883 100%);
            border: none;
            padding: 10px;
            font-weight: 600;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #0f0c13 0%, #181a25 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card login-card">
            <div class="card-header">
                <h3>Login</h3>
            </div>
            <div class="card-body p-4">
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Digite seu email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
                    </div>
                    <div class="mb-2 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" >
                        <label class="form-check-label" for="remember">
                            Lembrar-me
                        </label>
                    </div>
                    <button type="submit" class="btn btn-login w-100 mb-3">Entrar</button>
                </form>
                <hr>
                <div class="text-center">
                    <p class="mb-2">Não tem conta? <a href="#" class="text-decoration-none">Cadastre-se</a></p>
                    <p><a href="#" class="text-decoration-none">Esqueceu a senha?</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
