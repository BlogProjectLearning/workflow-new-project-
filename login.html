<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Firebase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:#000000;
    font-family:Arial,sans-serif;
}

.login-container{
    width:100%;
    max-width:400px;
    padding:15px;
}

.login-card{
    border:none;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0.5rem 1rem rgba(0,0,0,0.25);
}

.login-card .card-header{
    background:#808080;
    border:none;
    padding:20px;
}

.login-card .card-header h3{
    color:white;
    margin:0;
    text-align:center;
}

.form-control:focus{
    border-color:#7e7883;
    box-shadow:0 0 0 0.2rem rgba(126,120,131,0.25);
}

.btn-login{
    background:linear-gradient(135deg,#0a0d1d 0%,#7e7883 100%);
    border:none;
    padding:10px;
    font-weight:600;
    color:white;
}

.btn-login:hover{
    background:linear-gradient(135deg,#0f0c13 0%,#181a25 100%);
    color:white;
}

#mensagem{
    text-align:center;
    margin-top:10px;
    font-weight:bold;
}

a{
    color:#7e7883;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="card login-card">

        <div class="card-header">
            <h3>Login</h3>
        </div>

        <div class="card-body p-4">

            <form id="loginForm">

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Digite seu email"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <div class="mb-2 form-check">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="remember"
                    >

                    <label class="form-check-label">
                        Lembrar-me
                    </label>

                </div>

                <button
                    type="submit"
                    class="btn btn-login w-100 mb-3"
                >
                    Entrar
                </button>

            </form>

            <div id="mensagem"></div>

            <hr>

            <div class="text-center">

                <p class="mb-2">
                    Não tem conta?

                    <a href="cadastrase.html">
                        Cadastre-se
                    </a>
                </p>

                <p>
                    <a href="recuperarsenha.html">
                        Esqueceu a senha?
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>



<script type="module">

// FIREBASE
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAnalytics }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



// CONFIG FIREBASE
const firebaseConfig = {

    apiKey: "AIzaSyB8Vtm3yMziXsbVWmPrbQtiG6x2QESiDd8",

    authDomain: "new-project-7ad9e.firebaseapp.com",

    projectId: "new-project-7ad9e",

    storageBucket: "new-project-7ad9e.firebasestorage.app",

    messagingSenderId: "713177573867",

    appId: "1:713177573867:web:9788adaa105382e0ba11ae",

    measurementId: "G-K5R2KCF887"

};


// INICIALIZAR FIREBASE
const app = initializeApp(firebaseConfig);

const analytics = getAnalytics(app);

const auth = getAuth(app);


// FORM LOGIN
const form = document.getElementById("loginForm");


form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    const mensagem =
    document.getElementById("mensagem");


    try {

        const userCredential =
        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        mensagem.style.color = "green";

        mensagem.innerHTML =
        "Login realizado com sucesso!";


        console.log(userCredential.user);


        // REDIRECIONAR
         window.location.href = "index.html";


    } catch (error) {

        mensagem.style.color = "red";


        if(error.code === "auth/user-not-found"){

            mensagem.innerHTML =
            "Usuário não encontrado";

        }else if(error.code === "auth/wrong-password"){

            mensagem.innerHTML =
            "Senha incorreta";

        }else if(error.code === "auth/invalid-credential"){

            mensagem.innerHTML =
            "Email ou senha inválidos";

        }else{

            mensagem.innerHTML =
            "Erro ao fazer login";

        }

        console.log(error);

    }

});


</script>

</body>

</html>
